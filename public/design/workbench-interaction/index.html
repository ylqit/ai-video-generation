<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Studio · 工作台交互原型</title>
<style>body{margin:0;background:#f8f7fc;font:14px system-ui;color:#322942}header,footer{padding:16px 24px;background:white;display:flex;gap:14px;align-items:center;border-bottom:1px solid #e8e2f3}button,select,input{padding:9px;border:1px solid #ddd5ec;border-radius:8px;background:white;color:#51466a}button{cursor:pointer}button.primary{background:#7662d9;color:white}main{padding:28px;display:flex;gap:28px;min-height:520px}.card{padding:16px;border:1px solid #ddd4ef;background:white;border-radius:14px;width:240px;height:fit-content;box-shadow:0 6px 18px #33224408}.cover{height:140px;background:linear-gradient(135deg,#ece7fc,#dae8ed);display:grid;place-items:center;font-size:40px}.agent{margin-left:auto;width:330px}textarea{width:95%;height:80px;border:1px solid #ddd5ec;border-radius:6px}#refs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.chip{background:#eee8ff;border-radius:5px;padding:6px}.track{background:#eee8fa;padding:12px;display:flex;gap:2px}.clip{background:#8d7ade;color:white;padding:18px;resize:horizontal;overflow:auto}#timeline{display:none;padding:24px}small{color:#80748e}</style>
<header><strong>Studio　校园模型展</strong><button onclick="view(false)">画布</button><button onclick="view(true)">剪辑</button><span>交互原型 · 无真实任务</span><button id="add" class="primary">加入助手</button><label>导入<input id="files" type="file" multiple accept="image/*,video/*,audio/*,.txt,.md"></label></header>
<main id="canvas"><article class="card"><label><input type="checkbox" value="剧本">剧本</label><h3>先看见，再决定</h3><p>小岚发现模型缺口，停下并转向同伴。</p></article><article class="card"><label><input type="checkbox" value="人物参考">人物参考</label><div class="cover">♙</div><p>身份参考 · 固定版本 1</p></article><article class="card"><label><input type="checkbox" value="视频生成">视频生成</label><div class="cover">▷</div><textarea>角色看向桌面的模型，然后停下。</textarea><select><option>MiniMax H3 · 参考生成</option><option>Seedance · 参考生成</option></select><button id="generate" class="primary">准备候选</button><div id="candidate"></div></article><aside class="card agent"><strong>✧ 创作助手</strong><p>引用只提供读取依据，可修改范围另行指定。</p><div id="refs"></div><select><option>讨论</option><option>制作</option></select><details><summary>执行范围与用量</summary>只新增内容 · 20 步 · 媒体请求 0</details><textarea placeholder="描述目标…"></textarea><button onclick="document.getElementById('feedback').textContent='已固定引用。原型不提交模型请求。'">发送</button><p id="feedback"></p></aside></main>
<section id="timeline"><h2>交互剪辑</h2><input type="range" min="0" max="240" value="0" aria-label="播放头"><div class="track"><div class="clip" draggable="true">片段 A · 120 帧</div><div class="clip" draggable="true">片段 B · 120 帧</div></div><p>画面顺序轨 · 独立音轨 · 字幕轨</p><button onclick="document.getElementById('export').textContent='原型导出回执：240 帧。实际工程验收使用 FFmpeg 合成媒体。'">导出</button><p id="export"></p></section><footer id="status">选中、引用、选用分别管理</footer>
<script>const refs=new Set();document.querySelector('#add').onclick=()=>{document.querySelectorAll('input[type=checkbox]:checked').forEach(x=>refs.add(x.value));document.querySelector('#refs').replaceChildren(...[...refs].map(x=>{const b=document.createElement('button');b.className='chip';b.textContent=x+' ×';b.onclick=()=>{refs.delete(x);b.remove()};return b}))};document.querySelector('#files').onchange=e=>{document.querySelector('#status').textContent=[...e.target.files].map(f=>f.name+' · 导入原型').join(' / ')};document.querySelector('#generate').onclick=()=>{document.querySelector('#candidate').innerHTML='<p>模拟候选 1 · 未观察</p><button onclick="view(true)">加入剪辑</button>'};function view(edit){document.querySelector('#canvas').style.display=edit?'none':'flex';document.querySelector('#timeline').style.display=edit?'block':'none'}</script></html>
