<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studio · 自由创作预览</title><link rel="stylesheet" href="preview.css"></head>
<body><header class="top"><a class="brand" href="#works"><b>S</b> Studio</a><nav id="global"></nav><span class="sample">交互原型 · 模拟数据</span><select id="state" aria-label="预览状态"><option>正常</option><option>空白</option><option>离线</option><option>执行中</option><option>失败</option><option>版本冲突</option></select></header><div id="notice" role="status"></div><main id="app"></main><dialog id="create"><form method="dialog"><header><h2>新建作品</h2><button value="cancel">×</button></header><label>作品名称<input name="title" placeholder="给你的故事起个名字" required></label><label>创作方式<select name="start"><option>空白画布</option><option>从一句创意开始</option><option>导入已有材料</option></select></label><div class="fields"><label>作品类型<select><option>单部作品</option><option>系列作品</option></select></label><label>默认单集时长<input placeholder="按内容决定，或输入分钟"></label></div><p class="muted">集数与时长可以稍后调整。创建作品不会发起生成。</p><footer><button value="cancel" formnovalidate>取消</button><button class="primary" value="create">创建并打开画布</button></footer></form></dialog><script src="preview.js"></script></body></html>
